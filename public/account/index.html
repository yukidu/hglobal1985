<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#082b20">
<title>我的寰宇｜H-Global 會員中心</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/account/account.css">
<link rel="icon" type="image/svg+xml" href="/hglobal-icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<header class="topbar">
<a class="brand" href="/" aria-label="返回寰宇首頁"><span class="brand-mark">H</span><span><strong>寰宇全球</strong><small>H-GLOBAL</small></span></a>
<span class="account-caption">會員與管理控制台</span>
</header>
<main class="account-main">
<section class="hero account-hero">
  <div class="eyebrow">H-GLOBAL · MEMBER DESK</div>
  <h1>我的寰宇</h1>
  <p>管理活動報名、場地預約、訂閱與站內通知。</p>
</section>
<div id="accountStatus" class="account-status" role="status" aria-live="polite">正在驗證 Starry ID 會員登入…</div>
<section id="loginPanel" class="content-card" hidden>
  <h2>會員登入</h2>
  <p>會員資料由 Starry ID 統一驗證，H-Global 僅儲存本站必要業務資料。</p>
  <a class="account-link primary-btn" href="/auth/start">使用 Starry ID 登入</a>
</section>
<section id="authenticatedPanel" hidden>
  <nav class="account-tabs" id="accountTabs" aria-label="會員中心功能"></nav>
  <section class="content-card account-workspace" id="accountContent" aria-live="polite"></section>
</section>
</main>
<script src="/account/account.js" defer></script>
<script src="/pwa-register.js" defer></script>
</body>
</html>
