name: Apply isolated H-Global Preview legacy staging schema
on:
  push:
    branches: [feat/test-environment-foundation]
    paths:
      - .github/workflows/apply-preview-legacy-staging.yml
      - scripts/apply-preview-legacy-staging.mjs
      - migrations/0002_legacy_import_staging.sql
permissions:
  contents: read
concurrency:
  group: hglobal-preview-d1-legacy-staging
  cancel-in-progress: false
jobs:
  preview-staging:
    runs-on: ubuntu-latest
    environment: hglobal-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify staging SQL locally before remote D1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sqlite3
          db=sqlite3.connect(':memory:')
          db.executescript(Path('migrations/0001_initial_schema.sql').read_text())
          db.executescript(Path('migrations/0002_legacy_import_staging.sql').read_text())
          names={x[0] for x in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'legacy_import_batches','legacy_source_pages','legacy_source_revisions','legacy_media_audit'} <= names
          assert db.execute('SELECT COUNT(*) FROM pages').fetchone()[0] == 0
          print('Staging schema valid and published pages untouched')
          PY
      - name: Install pinned Wrangler for D1 staging schema
        run: npm install --no-save --no-package-lock wrangler@3.90.0
      - name: Apply review-only staging schema to Preview D1
        run: node scripts/apply-preview-legacy-staging.mjs
