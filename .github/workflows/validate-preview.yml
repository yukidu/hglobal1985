name: Validate H-Global preview
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check required preview files
        run: |
          test -s public/index.html
          test -s public/theme.css
          grep -q 'noindex,nofollow' public/index.html
          grep -q 'prefers-reduced-motion' public/theme.css
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.inside=False; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag == "script": self.inside=True
              def handle_endtag(self, tag):
                  if tag == "script": self.inside=False
              def handle_data(self, data):
                  if self.inside: self.parts.append(data)
          p=ScriptParser()
          p.feed(Path("public/index.html").read_text(encoding="utf-8"))
          Path("/tmp/hglobal-inline.js").write_text("\n".join(p.parts),encoding="utf-8")
          PY
          node --check /tmp/hglobal-inline.js

      - name: Run preview API contract tests
        run: node --test tests/*.test.mjs

  preview:
    name: Deploy Cloudflare Preview
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/test-environment-foundation'
    runs-on: ubuntu-latest
    environment: hglobal-preview
    concurrency:
      group: hglobal-preview-publish
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo '::error::Cloudflare Preview secrets are missing in environment hglobal-preview.'
            exit 1
          fi
      - name: Deploy Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=hglobal-preview --branch=feat/test-environment-foundation
      - name: Verify deployed Preview and public API
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/verify-preview.mjs
