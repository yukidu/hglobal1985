name: Apply isolated H-Global Preview registration guard
on:
  push:
    branches: [feat/test-environment-foundation]
    paths:
      - .github/workflows/apply-preview-registration-guard.yml
      - scripts/apply-preview-registration-guard.mjs
      - migrations/0004_registration_capacity_guard.sql
permissions:
  contents: read
concurrency:
  group: hglobal-preview-d1-registration-guard
  cancel-in-progress: false
jobs:
  preview-db:
    runs-on: ubuntu-latest
    environment: hglobal-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test actual SQLite trigger behavior before migration
        run: node --test tests/registration-capacity.test.mjs
      - name: Install pinned Wrangler
        run: npm install --no-save --no-package-lock wrangler@3.90.0
      - name: Preflight and apply to H-Global Preview D1 only
        run: node scripts/apply-preview-registration-guard.mjs
