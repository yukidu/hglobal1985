name: Apply isolated H-Global Preview D1 guard
on:
  push:
    branches: [feat/test-environment-foundation]
    paths:
      - .github/workflows/apply-preview-booking-guard.yml
      - scripts/apply-preview-booking-guard.mjs
      - migrations/0003_venue_booking_overlap_guard.sql
permissions:
  contents: read
concurrency:
  group: hglobal-preview-d1-guard
  cancel-in-progress: false
jobs:
  preview-db:
    runs-on: ubuntu-latest
    environment: hglobal-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test booking triggers against local SQLite first
        run: node --test tests/venue-booking-guard.test.mjs
      - name: Install pinned Wrangler for D1 migration
        run: npm install --no-save --no-package-lock wrangler@3.90.0
      - name: Preflight and apply non-destructive Preview-only D1 booking guard
        run: node scripts/apply-preview-booking-guard.mjs
